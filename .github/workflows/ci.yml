name: CI

on:
  # Every branch, not just main. Work happens on feature branches for weeks at a time, and a
  # workflow that only watches main reports nothing at all during exactly the period when a
  # regression is cheapest to fix — CI last ran here in June while a dozen commits landed.
  push:
  pull_request:
    branches: [ "main" ]

# A branch under active development gets several pushes in a row; only the newest is worth
# building. In-progress runs for the same ref are cancelled rather than queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM protocol tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run JVM protocol test suite
        run: ./gradlew :test-runner:test --stacktrace

      - name: Upload JVM test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-report
          path: test-runner/build/reports/tests/test/
          retention-days: 30
          if-no-files-found: ignore

  android-build:
    name: Android lint & debug APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googletv
            lint_task: :app:lintGoogletvDebug
            assemble_task: :app:assembleGoogletvDebug
            apk_path: app/build/outputs/apk/googletv/debug/app-googletv-debug.apk
          - flavor: firetv
            lint_task: :app:lintFiretvDebug
            assemble_task: :app:assembleFiretvDebug
            apk_path: app/build/outputs/apk/firetv/debug/app-firetv-debug.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Lint and build debug APKs
        run: ./gradlew ${{ matrix.lint_task }} ${{ matrix.assemble_task }} --stacktrace

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports-${{ matrix.flavor }}
          path: app/build/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk-${{ matrix.flavor }}
          path: ${{ matrix.apk_path }}
          retention-days: 7

  dev-release:
    name: Rolling dev prerelease
    needs: [ jvm-tests, android-build ]
    # Pushes to main only. A PR build must never move the tag people are installing from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changelog needs history, and the default shallow clone has none

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: debug-apk-*
          merge-multiple: true
          path: apks

      - name: Name the APKs by flavour
        # The in-app updater picks its asset by matching BuildConfig.FLAVOR against the asset name
        # (docs/UPDATE_CHECKER.md). Both files arrive here as app-<flavor>-debug.apk, which already
        # contains the flavour, but the released names should read like the tagged releases do.
        run: |
          mv apks/app-firetv-debug.apk    apks/PhairPlay-dev-firetv.apk
          mv apks/app-googletv-debug.apk  apks/PhairPlay-dev-googletv.apk
          ls -l apks

      - name: Build the changelog for this push
        id: notes
        run: |
          BEFORE="${{ github.event.before }}"
          # A new branch, or a force push, reports an all-zero "before" that git cannot resolve.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="-5"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          {
            echo "body<<PHAIRPLAY_EOF"
            echo "Automatic build of \`main\` — **not** a release. Cut \`vX.Y.Z\` by hand for those."
            echo
            echo "Commit \`${{ github.sha }}\`"
            echo
            echo "### Changes in this build"
            git log --no-merges --pretty='- %s (%h)' $RANGE
            echo "PHAIRPLAY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Clear the previous dev prerelease
        # softprops updates a release in place, but GitHub ignores target_commitish on an existing
        # published release, so the `dev` tag would stay pinned to whatever commit first created it
        # while the assets moved on underneath it. Deleting the tag as well is what actually makes
        # the release roll. Assets go with it, so nothing stale can survive either.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev --cleanup-tag --yes || true

      - name: Publish the rolling dev prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Latest build
          body: ${{ steps.notes.outputs.body }}
          prerelease: true
          make_latest: 'false'   # the updater reads /releases/latest; a prerelease must not claim it
          files: apks/*.apk

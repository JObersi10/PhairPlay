# Lint Workflow — runs Android Lint on every push and pull request.
# Helps maintain code quality and catch potential bugs early.

name: Lint

on:
  # Every branch, not just main. Work happens on feature branches for weeks at a time, and a
  # workflow that only watches main reports nothing at all during exactly the period when a
  # regression is cheapest to fix — CI last ran here in June while a dozen commits landed.
  push:
  pull_request:
    branches: [ "main" ]

# A branch under active development gets several pushes in a row; only the newest is worth
# building. In-progress runs for the same ref are cancelled rather than queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-lint:
    name: Android Lint (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googletv
            lint_task: :app:lintGoogletvDebug
          - flavor: firetv
            lint_task: :app:lintFiretvDebug

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # Set up Android SDK with required components
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Write local.properties (AGP requires sdk.dir to locate the Android SDK)
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Run Android Lint — checks for correctness, security, and performance issues.
      # The lint configuration in app/build.gradle.kts controls what is reported.
      # See: https://developer.android.com/studio/write/lint
      - name: Run Android Lint
        run: ./gradlew ${{ matrix.lint_task }} --stacktrace

      # Upload the lint report so it's easy to review in GitHub
      - name: Upload Lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report-${{ matrix.flavor }}
          path: app/build/reports/lint-results-*.html
          retention-days: 30
